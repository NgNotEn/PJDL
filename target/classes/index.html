<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PJDL System Dashboard</title>
    <style>
        :root { 
            --bg-color: #f1f5f9;
            --sidebar-width: 420px;
            --primary: #2563eb;
            --text-main: #334155;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --card-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
        }

        * { box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 0; 
            background: var(--bg-color); 
            height: 100vh; 
            display: flex; 
            flex-direction: column;
            color: var(--text-main);
        }

        /* --- Header --- */
        header {
            background: #1e293b;
            color: white;
            height: 60px;
            padding: 0 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            z-index: 10;
        }
        .brand { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 18px; }
        .tag { background: #3b82f6; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 500; }

        /* --- Layout --- */
        .container {
            flex: 1;
            display: flex;
            overflow: hidden;
            padding: 20px;
            gap: 20px;
        }

        /* --- Left Column: Control & Logs --- */
        .sidebar {
            width: var(--sidebar-width);
            display: flex;
            flex-direction: column;
            gap: 20px;
            flex-shrink: 0;
        }

        /* --- Right Column: Metrics & Data --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow: hidden;
        }

        /* --- Common Card Style --- */
        .card {
            background: white;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .card-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            color: #0f172a;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #f8fafc;
        }

        /* --- Components --- */
        
        /* 1. SQL Editor */
        .editor-container { flex-shrink: 0; }
        textarea {
            width: 100%;
            height: 150px;
            padding: 16px;
            border: none;
            resize: none;
            font-family: 'Monaco', 'Consolas', monospace;
            font-size: 13px;
            outline: none;
            color: #334155;
            background: #fff;
        }
        textarea:focus { background: #f8fafc; }
        .toolbar { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 10px; background: #fff; }
        button {
            padding: 8px 16px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: white;
            cursor: pointer;
            font-weight: 500;
            font-size: 13px;
            transition: all 0.2s;
        }
        button:hover { background: #f1f5f9; }
        button.primary { background: var(--primary); color: white; border-color: var(--primary); }
        button.primary:hover { background: #1d4ed8; }

        /* 2. Log Console */
        .log-container { flex: 1; min-height: 0; }
        .log-body {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            font-family: 'Monaco', monospace;
            font-size: 11px;
            line-height: 1.7;
            background: #ffffff;
        }
        .log-entry { padding: 2px 0; border-bottom: 1px dashed #f1f5f9; }
        .log-time { color: #94a3b8; font-weight: bold; margin-right: 8px; }
        .log-phase { color: #d97706; font-weight: bold; }
        .log-info { color: #64748b; }
        .log-worker { color: #059669; }

        /* 3. Metrics Row */
        .metrics-row {
            display: flex;
            gap: 20px;
            flex-shrink: 0;
        }
        .metric-card {
            flex: 1;
            background: white;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .metric-label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
        .metric-value { font-size: 24px; font-weight: 700; color: #0f172a; }
        .metric-sub { font-size: 12px; color: #10b981; display: flex; align-items: center; gap: 4px; }

        /* 4. Data Table */
        .data-container { flex: 1; min-height: 0; }
        .table-wrap { flex: 1; overflow: auto; position: relative; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; text-align: left; }
        thead th {
            position: sticky; top: 0;
            background: #f8fafc;
            color: var(--text-muted);
            font-weight: 600;
            padding: 12px 20px;
            border-bottom: 1px solid var(--border);
            white-space: nowrap;
            z-index: 5;
        }
        tbody td {
            padding: 10px 20px;
            border-bottom: 1px solid #f1f5f9;
            color: var(--text-main);
            white-space: nowrap;
        }
        tbody tr:nth-child(even) { background-color: #fcfcfc; }
        tbody tr:hover { background-color: #eff6ff; }

        /* Scrollbars */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    </style>
</head>

        </div>

        <div class="card data-container">
            <div class="card-header">
                Query Results

            <div class="table-wrap" id="tableOutput">

                    No results to display. Run a query to view data.

    </div>
</div>

        renderTable(INITIAL_DATA);

    // --- Core Logic ---

    async function executeQuery() {
        const sql = document.getElementById('sqlInput').value.trim();
        if(!sql) return;
        
        updateStatus("Executing...", true);
        const start = Date.now();

        try {
            const res = await fetch(`${API_URL}?sql=${encodeURIComponent(sql)}`);
            const json = await res.json();
            const duration = Date.now() - start;

            if(json.error) {
                // Show Error in logs
                const errLog = `[${new Date().toLocaleTimeString()}] | ERROR | ${json.error}`;
                const logs = document.getElementById('logOutput');
                logs.innerHTML += `<div class="log-entry" style="color:red;">${errLog}</div>`;
                logs.scrollTop = logs.scrollHeight;
                updateStatus("Error", false);
            } else {
                renderTable(json);
                renderLogs(json.logs);
                updateStatus("Success", false);
            }
        } catch(e) {
            alert("Network Error: " + e.message);
            updateStatus("Error", false);
        }
    }

    // --- UI Helpers ---

    function renderTable(json) {
        const box = document.getElementById('tableOutput');
        
        // Update Metrics
        const rowCount = json.data ? json.data.length : 0;
        document.getElementById('valRows').textContent = rowCount.toLocaleString();
        
        // Calculate total time from logs (End of last task - Start of first task)
        // Simple heuristic: just look at the timestamps in logs if available, else random
        let duration = 0;
        if(json.logs && json.logs.length > 0) {
            const first = parseTime(json.logs[0]);
            const last = parseTime(json.logs[json.logs.length-1]);
            if(first && last) duration = last - first;
        }
        if(duration > 0) document.getElementById('valTime').textContent = duration + " ms";

        if(rowCount === 0) {
            box.innerHTML = '<div style="padding:40px; text-align:center; color:#94a3b8;">No results found.</div>';
            return;
        }

        let html = '<table><thead><tr>';
        json.headers.forEach(h => html += `<th>${h}</th>`);
        html += '</tr></thead><tbody>';
        
        // Limit rows for performance
        json.data.slice(0, 1000).forEach(row => {
            html += '<tr>';
            row.forEach(cell => {
                let val = cell;
                if(typeof val === 'number') {
                    // Format large numbers
                    if(val > 1000) val = val.toLocaleString(undefined, {maximumFractionDigits: 2});
                }
                html += `<td>${val}</td>`;
            });
            html += '</tr>';
        });
        html += '</tbody></table>';
        box.innerHTML = html;
    }

        if(!logs) { 
            box.innerHTML = ''; 
            countBadge.textContent = '0 events';
            return; 
        }
        
        countBadge.textContent = `${logs.length} events`;
        let html = '';
        
        logs.forEach(line => {
            // Highlighting
            let cssClass = 'log-info';
            if(line.includes("PHASE")) cssClass = 'log-phase';
            else if(line.includes("WORKER")) cssClass = 'log-worker';
            
            // Simple parsing for colorization
            // Expected: [TIME] | TYPE | ...
            const parts = line.split('|');
            if(parts.length >= 3) {
                const time = parts[0].trim();
                const type = parts[1].trim();
                const msg = parts.slice(2).join('|').trim();
                
                html += `<div class="log-entry">
                    <span class="log-time">${time}</span>
                    <span class="${cssClass}">[${type}]</span>
                    <span>${msg}</span>
                </div>`;
            } else {
                html += `<div class="log-entry">${line}</div>`;
            }
        });
        
        box.innerHTML = html;
        box.scrollTop = box.scrollHeight;
    }

    function updateStatus(msg, loading) {
        const valStatus = document.getElementById('valStatus');
        valStatus.textContent = msg;
        valStatus.style.color = loading ? '#eab308' : (msg === 'Error' ? '#ef4444' : '#10b981');
    }

    // Helper to parse [HH:mm:ss.SSS] to ms for duration calc
    function parseTime(logLine) {
        try {
            const match = logLine.match(/\[(\d{2}):(\d{2}):(\d{2})\.(\d{3})\]/);
            if(!match) return null;
            const d = new Date();
            d.setHours(parseInt(match[1]));
            d.setMinutes(parseInt(match[2]));
            d.setSeconds(parseInt(match[3]));
            d.setMilliseconds(parseInt(match[4]));
            return d.getTime();
        } catch(e) { return null; }
    }

</script>
